<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#214039" />
    <link rel="icon" href="data:," />
    <title>Микрофронтенды — лабораторная №5</title>
  </head>
  <body>
    <header class="shell-header">
      <div class="shell-header-inner">
        <a class="shell-brand" href="/" data-route>Микрофронтенды</a>
        <nav class="shell-nav" aria-label="Приложения">
          <a href="/react" data-route>React</a>
          <a href="/vue" data-route>Vue</a>
        </nav>
      </div>
    </header>

    <main id="home" class="shell-panel" aria-labelledby="home-title">
      <p class="shell-label">Лабораторная работа №5</p>
      <h1 id="home-title">Две версии ленты постов</h1>
      <p class="shell-description">Выберите приложение.</p>
      <div class="home-apps">
        <a class="home-app" href="/react" data-route>
          <span class="home-app-name">React</span>
          <span class="home-app-detail">Лабораторная №3 · /react</span>
        </a>
        <a class="home-app" href="/vue" data-route>
          <span class="home-app-name">Vue</span>
          <span class="home-app-detail">Лабораторная №4 · /vue</span>
        </a>
      </div>
    </main>

    <main id="route-panel" class="shell-panel" aria-labelledby="route-heading" hidden>
      <h1 id="route-heading"></h1>
      <p id="route-description" class="shell-description" role="status"></p>
      <a id="route-home" href="/" data-route hidden>На главную</a>
      <button id="route-retry" type="button" hidden>Попробовать снова</button>
    </main>

    <div id="react-app" class="mfe-react" hidden></div>
    <div id="vue-app" class="mfe-vue" hidden></div>

    <script type="module" src="/src/orchestrator/main.js"></script>
  </body>
</html>
